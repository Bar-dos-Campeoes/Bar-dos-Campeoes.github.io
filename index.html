<body>

	<!-- HERO (Topo) -->
	<header class="hero" id="topo" aria-label="Bar dos Campeões">

	</header>

	<!-- SEÇÃO: MENU -->
	<section class="section" id="menu">
		<div class="section__inner">

			<a class="btn btn--primary" href="https://bar-dos-campeoes.github.io/Bar-dos-Campeoes-ementa.github.io/"
				target="_blank" rel="noopener noreferrer">
				Ver ementa & preçário completo
			</a>
		</div>
	</section>

	<!-- SEÇÃO: CONTACTOS + MORADA -->
	<section class="section section--dark">
		<div class="cards">
			<div class="card" id="contactos">
				<h3 class="card__title">Contactos</h3>
				<p class="card__line">📞 <a href="tel:+351967205482">+351 967 205 482</a></p>
				<p class="card__line">📞 <a href="tel:+351253981211">253 981 211</a></p>
				<p class="card__small">Seg–Dom: 08h–02h • Quartas: 08h–18h</p>
			</div>

			<div class="card" id="morada">
				<h3 class="card__title">Morada</h3>
				<p class="card__line">📍 R. do Cónego 52, 4740-033 Apúlia</p>

				<div class="card__actions">
					<a class="btn btn--ghost"
						href="https://www.google.com/maps?q=R.+do+C%C3%B3nego+52,+4740-033+Ap%C3%BAlia" target="_blank"
						rel="noopener noreferrer">
						Ver no mapa
					</a>

					<button class="btn btn--ghost" type="button" id="copyMorada">
						Copiar morada
					</button>
				</div>
			</div>
		</div>
	</section>

	<script>
		document.getElementById("copyMorada")?.addEventListener("click", async () => {
			try {
				await navigator.clipboard.writeText("R. do Cónego 52, 4740-033 Apúlia");
				alert("Morada copiada!");
			} catch (e) {
				alert("Não foi possível copiar. (O browser pode bloquear)");
			}
		});
	</script>
